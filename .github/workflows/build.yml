name: Build VideoDL

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Source tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile source
        run: python -m compileall -q src
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: VideoDL-windows-x64
          - os: ubuntu-22.04
            label: Linux x64
            artifact: VideoDL-linux-x64
          - os: macos-26
            label: macOS 26 Apple Silicon
            artifact: VideoDL-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Build desktop application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name VideoDL
          --collect-all yt_dlp
          --collect-all yt_dlp_ejs
          --collect-all PySide6
          src/videodl/__main__.py
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/VideoDL/*" -DestinationPath "VideoDL-windows-x64.zip" -Force
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: tar -czf VideoDL-linux-x64.tar.gz -C dist VideoDL
      - name: Package macOS archive
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/VideoDL.app VideoDL-macos-arm64.zip
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: VideoDL-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/VideoDL-*
